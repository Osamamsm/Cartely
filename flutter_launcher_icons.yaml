flutter_launcher_icons:
  image_path: "assets/logo/dark_on_light_logo.png"

  android: "launcher_icon"
  min_sdk_android: 21

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo/dark_on_light_logo.png"

  ios: true
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "assets/logo/dark_on_light_logo.png"
    background_color: "#FFFFFF"
    theme_color: "#60A5FA"

  windows:
    generate: true
    image_path: "assets/logo/dark_on_light_logo.png"
    icon_size: 48

  macos:
    generate: true
    image_path: "assets/logo/dark_on_light_logo.png"